[project]
name = "app-api"
version = "0.0.0"
description = "FastAPI API of the product"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16",
  "fastapi>=0.120",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "sqlalchemy>=2.0.40",
  "uvicorn>=0.35",
]

[dependency-groups]
dev = [
  "httpx2>=2.0",
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.uv]
package = false
# Supply-chain guard (same rule as pnpm's minimumReleaseAge): never resolve a version younger than 14 days.
exclude-newer = "14 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:cacheprovider --strict-markers"
# --strict-markers: an unknown marker is an error. xfail must fail strictly (an xpass is a failure).
xfail_strict = true
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "DTZ", "T20", "PL"]
ignore = [
  "PLR0913", # FastAPI handlers take many dependencies
  "PLR2004", # magic values are fine in tests and status codes
  "S101",    # assert is how pytest asserts
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR0915"]
"scripts/**" = ["T201", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["app", "helpers", "checkout_env", "testdb", "test_env"]
