name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Throwaway CI database on localhost only.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      # ./verify creates .env from .env.example with this Postgres role.
      DB_USER: postgres
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scans the history

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable corepack (pnpm pinned by package.json)
        run: corepack enable

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Create .env for CI
        # .env is gitignored; build it from .env.example (template placeholders, if still present,
        # get CI values). ./verify replaces SESSION_SECRET=change-me with a random secret.
        run: |
          sed -e 's/{{PROJECT}}/ci/g; s/{{DB_NAME}}/app_ci/g; s/{{API_PORT}}/4000/g; s/{{WEB_PORT}}/3000/g' \
              -e 's#postgres://[^@]*@#postgres://postgres@#' .env.example > .env

      - name: Install dependencies
        run: |
          corepack pnpm install --frozen-lockfile
          (cd apps/api && uv sync --frozen)

      - name: Install Playwright browser
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Verify (typecheck, lint, unit, e2e, security)
        run: ./verify

      - name: Production build
        run: corepack pnpm --filter @app/web build

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
